services:
  - type: web
    name: aichatagents
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      # Paste the full Firebase service account JSON (one line) here —
      # Render has no ambient GCP credentials the way Cloud Run does.
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v21.0
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_LABEL_TO_WATCH
        value: INBOX
      - key: GMAIL_CRON_SECRET
        sync: false
